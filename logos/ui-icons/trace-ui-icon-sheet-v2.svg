<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-labelledby="title desc">
  <title id="title">Trace monochrome BB UI icon concepts, round two</title>
  <desc id="desc">Six additional monochrome outline icon directions designed for the BB user interface.</desc>
  <defs>
    <style>
      .card { fill: #171D22; stroke: #2A3239; stroke-width: 1; }
      .label { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #F4F4F5; }
      .note { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #98A2AD; }
      .num { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2px; fill: #98A2AD; }
      .icon { fill: none; stroke: #F4F4F5; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <symbol id="spine" viewBox="0 0 24 24">
      <g class="icon"><path d="M7 3.5v17"/><circle cx="7" cy="4.5" r="1.7"/><circle cx="7" cy="12" r="2.7"/><circle cx="7" cy="19.5" r="1.7"/><path d="M11 6h5.5M11 12h8M11 18h5.5" opacity=".55"/></g>
    </symbol>
    <symbol id="focus" viewBox="0 0 24 24">
      <g class="icon"><path d="M7.5 4.5H5.5v3M16.5 4.5h2v3M5.5 16.5v3h2M18.5 16.5v3h-2"/><path d="M7.2 9.5c1.9 0 1.9 3.7 4.1 3.7s2.1-4.4 4.9-4.4"/><circle cx="7.2" cy="9.5" r="1.2" fill="#F4F4F5" stroke="none"/><circle cx="11.3" cy="13.2" r="1.2" fill="#F4F4F5" stroke="none"/><circle cx="16.2" cy="8.8" r="1.2" fill="#F4F4F5" stroke="none"/></g>
    </symbol>
    <symbol id="fork" viewBox="0 0 24 24">
      <g class="icon"><path d="M3.5 6h2.4c2.2 0 2.5 6 6.1 6M3.5 18h2.4c2.2 0 2.5-6 6.1-6M12 12h8.5"/><circle cx="3.5" cy="6" r="1.2" fill="#F4F4F5" stroke="none"/><circle cx="3.5" cy="18" r="1.2" fill="#F4F4F5" stroke="none"/><circle cx="12" cy="12" r="2"/><path d="m18.5 10 2 2-2 2"/></g>
    </symbol>
    <symbol id="stack" viewBox="0 0 24 24">
      <g class="icon"><rect x="6" y="3.5" width="14" height="4.5" rx="1.4" opacity=".35"/><rect x="6" y="9.75" width="14" height="4.5" rx="1.4"/><rect x="6" y="16" width="14" height="4.5" rx="1.4" opacity=".35"/><path d="M8.5 5.75h1.7M12 5.75h5M8.5 12h2.3M12.5 12h4.5M8.5 18.25h1.7M12 18.25h5"/><path d="M4 7v10M4 7l1.2 1.2M4 17l1.2-1.2" opacity=".65"/></g>
    </symbol>
    <symbol id="replay" viewBox="0 0 24 24">
      <g class="icon"><path d="M18.5 8.5A7.3 7.3 0 1 0 19 14"/><path d="M18.5 8.5V5.4M18.5 8.5h-3.1"/><path d="M12 6.5v11"/><circle cx="12" cy="6.5" r="1.3"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="17.5" r="1.3"/></g>
    </symbol>
    <symbol id="wave" viewBox="0 0 24 24">
      <g class="icon"><path d="M7.5 4.5H5.5v3M16.5 4.5h2v3M5.5 16.5v3h2M18.5 16.5v3h-2"/><path d="M5.8 12h2l1.2-2.8 1.6 5.6 1.7-8 1.7 10.4 1.6-5.2 1.2 2h1.4"/><circle cx="5.8" cy="12" r=".9" fill="#F4F4F5" stroke="none"/><circle cx="18.2" cy="12" r=".9" fill="#F4F4F5" stroke="none"/></g>
    </symbol>
  </defs>

  <rect width="960" height="590" rx="24" fill="#101418"/>
  <text x="32" y="42" font-size="12" font-weight="700" letter-spacing="3" fill="#98A2AD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">TRACE / BB UI ICONS · ROUND 2</text>
  <text x="928" y="42" text-anchor="end" font-size="12" fill="#68737E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">monochrome · outline · 24px</text>

  <g><rect class="card" x="28" y="70" width="286" height="218" rx="16"/><use href="#spine" x="129" y="91" width="84" height="84"/><text class="num" x="50" y="206">07</text><text class="label" x="50" y="232">Thread spine</text><text class="note" x="50" y="257">线程主轴</text></g>
  <g><rect class="card" x="337" y="70" width="286" height="218" rx="16"/><use href="#focus" x="438" y="91" width="84" height="84"/><text class="num" x="359" y="206">08</text><text class="label" x="359" y="232">Focus path</text><text class="note" x="359" y="257">聚焦事件</text></g>
  <g><rect class="card" x="646" y="70" width="286" height="218" rx="16"/><use href="#fork" x="747" y="91" width="84" height="84"/><text class="num" x="668" y="206">09</text><text class="label" x="668" y="232">Fork &amp; merge</text><text class="note" x="668" y="257">分支与汇合</text></g>
  <g><rect class="card" x="28" y="316" width="286" height="218" rx="16"/><use href="#stack" x="129" y="337" width="84" height="84"/><text class="num" x="50" y="452">10</text><text class="label" x="50" y="478">Log stack</text><text class="note" x="50" y="503">原始记录</text></g>
  <g><rect class="card" x="337" y="316" width="286" height="218" rx="16"/><use href="#replay" x="438" y="337" width="84" height="84"/><text class="num" x="359" y="452">11</text><text class="label" x="359" y="478">Replay</text><text class="note" x="359" y="503">回放与历史</text></g>
  <g><rect class="card" x="646" y="316" width="286" height="218" rx="16"/><use href="#wave" x="747" y="337" width="84" height="84"/><text class="num" x="668" y="452">12</text><text class="label" x="668" y="478">Wave frame</text><text class="note" x="668" y="503">事件波形</text></g>
</svg>
